# profiles/examples/owner-ceo-example/role.yaml
# СИНТЕТИЧЕСКИЙ пример ролевого профиля: владелец, учредитель, генеральный
# директор и председатель совета директоров вымышленной группы «Демо-Групп».
# Показывает, куда ушла owner/CEO/board-специфика исходной онтологии v1.1.0:
# управленческие представления, решения и поручения, портфель инициатив,
# board pack, недельный и месячный обзор, краткий управленческий экран.
# Реальных лиц нет.

